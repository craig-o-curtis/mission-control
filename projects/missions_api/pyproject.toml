[project]
name = "missions-api"
version = "1.0.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.140.0",
    "uvicorn>=0.30.0",
    "shared",
]

[project.scripts]
missions-api = "missions_api.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
