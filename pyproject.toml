[project]
name = "fastapi-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "books-api",
    "tasks-api",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "ty>=0.0.63",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.9.1",
    "pre-commit>=3.5.0",
]

[tool.uv.workspace]
members = ["projects/books_api", "projects/tasks_app", "libs/shared"]

[tool.uv.sources]
shared = { workspace = true }
books-api = { workspace = true }
tasks-api = { workspace = true }

[tool.ruff]
target-version = "py314"
include = ["**/*.py"]
exclude = ["__pycache__", ".git"]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]
testpaths = ["projects", "libs"]
